name: offline

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -r requirements.txt
      - name: check_routes
        run: python eval/check_routes.py
      # Monolith 排他后端：未配置仍是 official；非法值与选错入口都拒绝。不连编辑器。
      - name: check_backend
        run: python eval/check_backend.py
      # U0（20261027 升级计划）：Monolith 连接层一次重试、失败指引、探活。全离线。
      - name: check_backend_health
        run: python eval/check_backend_health.py
      # U1（20261027 升级计划）：bind_blueprint / create_widget_blueprint 的 producer 侧判词。全离线。
      - name: check_producer_judges
        run: python eval/check_producer_judges.py
      # U4（20261027 升级计划）：set_scalar_param / place_batch 的写前快照与失败回滚。全离线。
      - name: check_write_rollback
        run: python eval/check_write_rollback.py
      # U3b（20261027 升级计划）：条款绑定回归——窗口全败时条款必须保持 false，
      # launch_editor 的 synthetic 判词翻不动宽绑定条款（20261027-180955 的假通过）。全离线。
      - name: check_criteria_binding
        run: python eval/check_criteria_binding.py
      # U3a（20261027 升级计划）：动作 × 后端覆盖矩阵——sequence 的原语必须已桥或已声明
      # 不支持，CATALOG 动作必须有后端覆盖声明（20261027-180955 的断链）。全离线。
      - name: check_backend_coverage
        run: python eval/check_backend_coverage.py
      # FPS HUD 链路（20261029）：整句 HUD 需求必须零模型拆句（hud-rules），
      # 模块入口真实可调用（防函数头被吞的 NameError），判词/C++/布局三处控件名一致。全离线。
      - name: check_fps_hud
        run: python eval/check_fps_hud.py
      # 20261117-140229：只提「血条」一类读数的请求曾因「上限/样式/仿照…设计」半句判 uncovered
      # 掉进通用受控求解。钉「单读数 → hud-rules 且只落地所需控件，整句 HUD 仍全合同」。全离线。
      - name: check_hud_single_readout
        run: python eval/check_hud_single_readout.py
      # FPS HUD 与 UMG 桥后续升级（Plan/20261029-1240）的四条护栏。全离线、不连编辑器：
      # 控件事件绑定走 blueprint.add_node(ComponentBoundEvent) 而非「无 action」；
      # NamedSlot/类级查询如实留在人工清单；AddWidget 的 childIndex 不再静默丢弃；
      # 方案层「一次结构化重问 + 截断保护」与 LLM 429/5xx 有限退避、401 一次就停。
      - name: check_widget_event_binding
        run: python eval/check_widget_event_binding.py
      - name: check_widget_slot_gaps
        run: python eval/check_widget_slot_gaps.py
      - name: check_solver_plan_retry
        run: python eval/check_solver_plan_retry.py
      - name: check_llm_backoff
        run: python eval/check_llm_backoff.py
      - name: check_info_layer
        run: python eval/check_info_layer.py
      - name: check_architecture
        run: python eval/check_architecture.py
      - name: check_schema
        run: python eval/check_schema.py
      - name: check_risk
        run: python eval/check_risk.py
      - name: check_automation
        run: python eval/check_automation.py
      # 闭环合同（20261024 整改）。这七条只依赖本仓库：run_task / exec_tool / complete 全是替身，
      # RUNS/EVENTS/ARCHIVE/SNAPSHOTS/BRIEFS/LEDGER 全部隔离到临时目录，不联网、不调模型、不碰编辑器。
      # 之前它们只在 WORKFLOW.md 里记本机命令，CI 上没有护栏：run_windows 的聚合口径坏掉也不会红。
      - name: check_harness
        run: python eval/check_harness.py
      - name: check_stitch
        run: python eval/check_stitch.py
      - name: check_upgrade
        run: python eval/check_upgrade.py
      # 20261024-192858 的整改链，一条一扇：
      # create_level 动作 + 归地 + 补窗；零窗口范围的结构化能力缺口；归档证据不被二次归档清空；
      # 集成矩阵「交付验收」四态；以及 T3 的端到端离线回归（原句 → 规划/物化 → 真跑 → 收尾状态）。
      - name: check_create_level
        run: python eval/check_create_level.py
      # 20261117-122532：路线图把 launch_editor 与 open_level 画成同层并排、彼此无连线。
      # 根因是 windows_from_rules 没给 open_level/create_level 挂「编辑器已启动」的前置依赖
      # （执行层也因此会在同一轮派发，冷启动时 open_level 先跑会连不上 MCP）。钉串行链与
      # 「独立步骤不虚连」两条口径，全离线。
      - name: check_roadmap_deps
        run: python eval/check_roadmap_deps.py
      # 2026-10-28 手榴弹能力接线：implement_grenade 三态断言（缺前置引导、补拾取幂等、automation 收口）。
      - name: check_implement_grenade
        run: python eval/check_implement_grenade.py
      # 20261028 求解循环（Plan/20261028-1438）：编译回灌、受控求解、solve 扇开关、蒸馏闭环。
      # 四条全离线：编译/裁判/模型/discover 全是替身，轨迹与蒸馏产物隔离到临时目录。
      - name: check_build_error_loop
        run: python eval/check_build_error_loop.py
      - name: check_solver_budget
        run: python eval/check_solver_budget.py
      - name: check_solve_gap_fallback
        run: python eval/check_solve_gap_fallback.py
      - name: check_solver_distill
        run: python eval/check_solver_distill.py
      # 20261028-183641 卡壳修复：射速×100 进 solve 扇只会编 run_python（没放行必被拒，
      # 还白烧一次重试）。钉三件事：盘点按写闸过滤、写闸拒绝不重试不烧预算、
      # patch 路线（改已有源文件一处替换 → 复用 apply_spec 编译管线）。全离线。
      - name: check_solver_patch
        run: python eval/check_solver_patch.py
      # 20261028-2058：stdin 单次消费与超 30 分钟无心跳 run 改判 orphaned。全离线。
      - name: check_orphan_run
        run: python eval/check_orphan_run.py
      # 能力面对账自测（fixture 离线跑；真数据源要编辑器在线导出，见 pipelines/export_capability_surface.py）。
      - name: check_capability_surface
        run: python eval/check_capability_surface.py --selftest
      - name: check_capability_gap
        run: python eval/check_capability_gap.py
      - name: check_archive_fidelity
        run: python eval/check_archive_fidelity.py
      - name: check_integrate_verdict
        run: python eval/check_integrate_verdict.py
      # 20261117-140229 的 W3 假失败：合同落在 scope["criteria"]（brief 物化路径），run 级被
      # stitch 摘空后交付验收读不到任何条款 ⇒ judge_failed。钉「范围级条款也要被看见」，
      # 且未过仍判失败（不许把真失败撑成成功）。全离线。
      - name: check_integrate_scope_criteria
        run: python eval/check_integrate_scope_criteria.py
      # T3 独立复验：独立写的断言 + 对抗性用例。data/briefs 与 data/runs 是 gitignore 的，
      # CI 上不存在时用同形状内联替身（文件里会打印一句），断言照样跑。
      - name: check_failure_192858
        run: python eval/check_failure_192858.py
      # DSH 离线检查。这四条只依赖本仓库（临时目录 + mock/假 judge），CI 可跑。
      # check_dsh_config.py 与 check_dsh_bridge.py 不进 CI：前者要同级 AIAgentProject
      # 仓库与绝对路径的 venv，后者要拉检索模型与 data/chroma，只在 WORKFLOW.md 记本机命令。
      - name: check_dsh_contract
        run: python eval/check_dsh_contract.py
      # verify spec 的入口空洞（20261024-011917）：新记录能从 entry["task"] 读回 spec，
      # 旧记录回落不炸，只有裁判 {ok, kind} 对上才改 passed。
      - name: check_verify_spec
        run: python eval/check_verify_spec.py
      - name: check_dsh_lock
        run: python eval/check_dsh_lock.py
      - name: check_dsh_costs
        run: python eval/check_dsh_costs.py
      # 20261024-192858 能力缺口盲区的升级批次（docs/upgrade/next-upgrade-plan.md 的 D1–D11）。
      # 与上面「本次修复」那批分开写注释：上面是把这一次的事做对，下面这批是
      # 让下一次不会以另一种形式再来一次。每组只依赖本仓库，不联网、不调模型、不碰编辑器。
      - name: check_catalog_parity
        run: python eval/check_catalog_parity.py
      - name: check_evidence_attribution
        run: python eval/check_evidence_attribution.py
      - name: check_escalation
        run: python eval/check_escalation.py
      - name: check_review_coverage
        run: python eval/check_review_coverage.py
      - name: check_candidate_aging
        run: python eval/check_candidate_aging.py
      - name: check_lexicon
        run: python eval/check_lexicon.py
      - name: check_plan_parity
        run: python eval/check_plan_parity.py
      - name: check_bench_provenance
        run: python eval/check_bench_provenance.py
      - name: check_distill
        run: python eval/check_distill.py
      - name: check_scoring_integrity
        run: python eval/check_scoring_integrity.py
      - name: check_statuses
        run: python eval/check_statuses.py
      - name: retrieval_bench
        run: python eval/retrieval_bench.py
      # 20261112-1220 §4.4：机器跑基准 + 人抽查做成真门。没有 batch/audit 时红是设计意图。
      - name: check_bench_audit
        run: python eval/check_bench_audit.py
      # 20261116-1530 HTML 入口层第 2 期（S-0/A-1/A-2/O-1/O-2）。三条都只依赖本仓库：
      # check_entry_spawn 把 subprocess.Popen 换成替身，钉 --force 透传 / 改名早于打开 /
      # --plain 只在多窗口（原 check_start_bat 钉的旧菜单式 start.bat 已删除；现行
      # AIAgentProject/start.bat 只起服务、不含 run 逻辑，判据搬到这里），
      # check_entry_paths 在封闭环境跑 plan_windows 与 prompt_builder（一次模型调用都不许发生），
      # check_observer_labels 只比状态表与 _runs_day 分桶。
      - name: check_entry_spawn
        run: python eval/check_entry_spawn.py
      - name: check_entry_paths
        run: python eval/check_entry_paths.py
      - name: check_observer_labels
        run: python eval/check_observer_labels.py
      # 第 3 期：决策通道（question/answer 事件 + 收件箱）与驱动（请求文件 + 子进程）。
      # subprocess.Popen 在 check_entry_drive 里换成替身，所以 CI 上不起真 run、不调模型。
      - name: check_entry_questions
        run: python eval/check_entry_questions.py
      - name: check_entry_drive
        run: python eval/check_entry_drive.py
      # 发送按钮接线（20261116「输入指令卡死」修复）：btn-send 不许裸挂 send，否则 click 的
      # MouseEvent 被当成 resume，点「发送」实际发 :resume latest。只读静态页，全离线。
      - name: check_entry_send
        run: python eval/check_entry_send.py
      # 任务书人审门的「确认」= 空答案，不许被当成 timeout 而放弃任务。
      # 20261116「输入指令卡死」修复的配套断言（空壳 run + 空答案语义）。
      - name: check_entry_brief_confirm
        run: python eval/check_entry_brief_confirm.py
      # 结构修复：run 记录必须在「规划 + 任务书人审」之前落盘，且 execute_windows 复用同一 run_id。
      - name: check_entry_run_scaffold
        run: python eval/check_entry_run_scaffold.py
      # 20261117 用户反馈：出任务书时界面无提示、右侧无窗口、像卡死。钉三件反馈：
      # 顶栏预估倒计时 + 中央后台日志（/api/uilog 左对齐轨迹）+ 规划期「规划中」占位卡。只读静态页，全离线。
      - name: check_entry_ui_feedback
        run: python eval/check_entry_ui_feedback.py
      # 一步拉起：默认自动开浏览器、--no-open 关掉、已有实例不抢端口、端口 listen 之后才开。
      # 全离线：不起 uvicorn、不开真浏览器、不连编辑器。
      - name: check_entry_launch
        run: python eval/check_entry_launch.py
      # 双击入口 AIAgentProject\start.bat：起服务这一件事本身也要钉。
      # 它坏起来没有运行时症状（双击闪一下、页面没出来），所以换到无关 cwd 跑真 cmd，
      # 钉 %~dp0 不被 shift 吃掉、默认 8011、参数转发、nopause/pause 口径、缺件指路。
      - name: check_entry_bat
        run: python eval/check_entry_bat.py
      # place_light 拆窗（20261117-1015 修复）：放灯整句与「启动编辑器 / 打开关卡 / 编译」
      # 同句时，launch_only / 通用步骤曾把 place_light 扇整条吃掉，灯根本不放。全离线。
      - name: check_place_light
        run: python eval/check_place_light.py
      # 连接词层（20261117）：然后/并且/顺便… 在零模型下被拆句并接住，不再掉给理解器。
      # 只做「拆句 + 覆盖」；顺序依赖不自动串（避免 steps 重排把因果接反）。全离线。
      - name: check_connectives
        run: python eval/check_connectives.py
      # `_is_cpp_edit` 的「加一个/添加/新增+场景物体」假阳性（20261117）：把「加个灯」判成
      # 改 C++ 会挤掉「然后编译工程」的编译扇，整句掉给模型。全离线。
      - name: check_cpp_edit_scene
        run: python eval/check_cpp_edit_scene.py
      # 缺信息暂停「先问模型、补不出再问人」（20261117）：缺路径/蓝图/源文件/过滤器时先让模型补，
      # 减少人工裁决；补不出时人工路径一字不改。全离线（模型替身）。
      - name: check_model_fill
        run: python eval/check_model_fill.py
      # 20261117 全域模型/脚本边界升级（Plan/20261117-1610 总览 + 8 份分计划）。
      # 共享内核 + 九域 Spec 内核（validate/plan_ops/exec_op/verify/repair）+ 只读复核 + 沉淀候选。
      # 十一只全离线：不连编辑器、不调模型（exec 用注入替身）；各域守卫钉「好 Spec 零错 / 坏 Spec 被判 /
      # kernel 确定性 / adapter 覆盖 / verifier 正反 / route 不误报 / 回灌有上限」。
      - name: check_spec_pipeline
        run: python eval/check_spec_pipeline.py
      - name: check_spec_toolmap
        run: python eval/check_spec_toolmap.py
      - name: check_spec_boundary
        run: python eval/check_spec_boundary.py
      - name: check_umg_spec
        run: python eval/check_umg_spec.py
      - name: check_graph_spec
        run: python eval/check_graph_spec.py
      - name: check_animgraph_spec
        run: python eval/check_animgraph_spec.py
      - name: check_material_spec
        run: python eval/check_material_spec.py
      - name: check_niagara_spec
        run: python eval/check_niagara_spec.py
      - name: check_animation_spec
        run: python eval/check_animation_spec.py
      - name: check_sequencer_spec
        run: python eval/check_sequencer_spec.py
      - name: check_postprocess_spec
        run: python eval/check_postprocess_spec.py
      - name: check_cpp_spec
        run: python eval/check_cpp_spec.py
