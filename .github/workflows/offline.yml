name: offline

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -r requirements.txt
      - name: check_routes
        run: python eval/check_routes.py
      - name: retrieval_bench
        run: python eval/retrieval_bench.py
